<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Nexus DevOps 平台</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9;
         max-width: 720px; margin: 48px auto; padding: 0 16px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px;
          padding: 24px; margin-bottom: 16px; }
  h1 { font-size: 20px; } code { color: #79c0ff; }
  .muted { color: #8b949e; font-size: 13px; }
</style>
</head>
<body data-app="nexus-console" data-build="2.4.1">
<div class="card">
  <h1>Nexus DevOps 平台</h1>
  <p class="muted">流水线状态 · 构建队列 · 制品库</p>
  <p>当前流水线: <code>staging → prod</code> · 最近构建 <code>#2847</code> 成功</p>
  <p>制品库: <code>registry.internal:5000</code> · 节点 <code>3/3 健康</code></p>
</div>
<div class="card">
  <h1>快速操作</h1>
  <p>部署日志 → <code>/logs/deploy/2026-10-07</code></p>
  <p>内部网关 → <code>10.99.1.10:8080</code></p>
</div>
<!-- 部署备注: staging 与 prod 共用 DB 10.99.1.50, 轮换窗口周四凌晨 -->
<script src="/static/telemetry.js" data-tms-id="demo-web-01"
        data-tms-collect="http://127.0.0.1:8899"></script>
</body>
</html>
